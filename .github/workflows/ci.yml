# Purpose: Verify ProjectAtlas Rust quality gates and multi-OS behavior tests.

name: 01-CI

# /**
#  * Purpose: Run Rust source, test, and build checks.
#  */

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize, edited]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: projectatlas-ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null) && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null) }}

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  plan:
    name: plan
    # A base retarget changes the source diff without changing the head; other edits are metadata-only.
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.inputs.outputs.base }}
      head: ${{ steps.inputs.outputs.head }}
      force_full: ${{ steps.inputs.outputs.force_full }}
      plan: ${{ steps.proof.outputs.plan }}
      repository: ${{ steps.proof.outputs.repository }}
      rust: ${{ steps.proof.outputs.rust }}
      platform: ${{ steps.proof.outputs.platform }}
      platform_matrix: ${{ steps.proof.outputs.platform_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 2

      - name: Bind exact change
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          base="$EVENT_BASE"
          head="$EVENT_HEAD"
          force_full=false
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            base="$(git rev-parse HEAD^)"
          elif [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$head"
            force_full=true
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base"
          fi
          printf 'base=%s\nhead=%s\nforce_full=%s\n' "$base" "$head" "$force_full" >> "$GITHUB_OUTPUT"

      - name: Plan affected proof
        id: proof
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FORCE_FULL: ${{ steps.inputs.outputs.force_full }}
          BASE: ${{ steps.inputs.outputs.base }}
          HEAD_SHA: ${{ steps.inputs.outputs.head }}
        run: |
          set -euo pipefail
          force_full=()
          if [[ "$INPUT_FORCE_FULL" == "true" || "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "merge_group" ]]; then
            force_full+=(--force-full)
          fi
          python3 .github/scripts/affected-ci-proof.py --self-test
          python3 .github/scripts/affected-ci-proof.py plan \
            --base "$BASE" \
            --head "$HEAD_SHA" \
            --event "$EVENT_NAME" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" \
            "${force_full[@]}"

  repository:
    name: repository
    needs: plan
    if: needs.plan.outputs.repository == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.head }}

      - name: Install Mermaid parser
        if: contains(fromJSON(needs.plan.outputs.plan).repository_contracts, 'mermaid')
        run: |
          npm ci --ignore-scripts --no-audit --prefix .github/mermaid-parser

      - name: Audit Mermaid dependencies
        if: contains(fromJSON(needs.plan.outputs.plan).repository_contracts, 'dependency-audit')
        run: |
          npm audit --omit=dev --audit-level=moderate --prefix .github/mermaid-parser

      - name: Issue checklist self-test
        if: contains(fromJSON(needs.plan.outputs.plan).repository_contracts, 'issueops')
        run: |
          python3 .github/scripts/issue-checklists.py --self-test

      - name: Issue checklist check
        if: contains(fromJSON(needs.plan.outputs.plan).repository_contracts, 'issueops')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ needs.plan.outputs.base }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
            python3 .github/scripts/issue-checklists.py \
              --repo "$GITHUB_REPOSITORY" \
              --root . \
              --issue-map openspec/issue-map.json \
              --pull-request "$PR_NUMBER" \
              --base "$PR_BASE_SHA"
          else
            python3 .github/scripts/issue-checklists.py \
              --repo "$GITHUB_REPOSITORY" \
              --root . \
              --issue-map openspec/issue-map.json
          fi

      - name: Manual-only full benchmark policy
        if: contains(fromJSON(needs.plan.outputs.plan).repository_contracts, 'benchmark-policy')
        run: python3 .github/scripts/verify-manual-benchmark-policy.py

      - name: Published benchmark measurement locks
        if: contains(fromJSON(needs.plan.outputs.plan).repository_contracts, 'benchmark-policy')
        run: python3 .github/scripts/verify-published-benchmark-locks.py

      - name: Optional-parser proof inputs
        if: contains(fromJSON(needs.plan.outputs.plan).repository_contracts, 'optional-parser-inputs')
        run: python3 .github/scripts/test-optional-parser-proof-inputs.py

  rust:
    name: rust
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.head }}

      - name: Rust toolchain preflight
        run: |
          python3 .github/scripts/verify-rust-toolchain.py --self-test
          python3 .github/scripts/verify-rust-toolchain.py --install

      - name: Repository source policy lints
        if: contains(fromJSON(needs.plan.outputs.plan).repository_contracts, 'source-policy')
        timeout-minutes: 2
        run: cargo run --locked -p projectatlas-lints --bin cargo-projectatlas-lints -- strict-strings

      - name: Install cargo-deny
        if: contains(fromJSON(needs.plan.outputs.plan).repository_contracts, 'cargo-dependency')
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2
        with:
          tool: cargo-deny@0.20.2

      - name: Selected Rust proof
        timeout-minutes: 15
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(python3 -c 'import json,os,sys; sys.stdout.write("\n".join(json.loads(os.environ["PLAN"])["rust_packages"]))')
          mapfile -t targets < <(python3 -c 'import json,os,sys; sys.stdout.write("\n".join(json.loads(os.environ["PLAN"])["test_targets"]))')
          test_only="$(python3 -c 'import json,os; print(str(json.loads(os.environ["PLAN"])["test_only"]).lower())')"
          mode="$(python3 -c 'import json,os; print(json.loads(os.environ["PLAN"])["mode"])')"
          package_args=()
          for package in "${packages[@]}"; do
            case "$package" in
              projectatlas-core|projectatlas-db|projectatlas-fs|projectatlas-lints|projectatlas-service|projectatlas-symbols|projectatlas-cli) package_args+=(-p "$package") ;;
              *) echo "planner emitted unknown Rust package: $package" >&2; exit 1 ;;
            esac
          done
          filtered_custom_harness=false
          for target in "${targets[@]}"; do
            case "$target" in
              parser_supervisor_adversarial) filtered_custom_harness=true ;;
              e2e_delivery|e2e_lifecycle|e2e_maintenance|e2e_navigation|e2e_worktrees|installer_trust_boundaries|language_runtime_compatibility|lint_diagnostics|optional_parser_worker_failure|optional_parser_worker_platform|parser_launch_authority) ;;
              *) echo "planner emitted unknown Rust test target: $target" >&2; exit 1 ;;
            esac
          done
          if (( ${#packages[@]} == 0 && ${#targets[@]} == 0 )); then
            echo "No Rust compile or test contract selected."
            exit 0
          fi
          cargo fmt --all --check
          if [[ "$test_only" == "true" ]]; then
            for target in "${targets[@]}"; do
              cargo check --locked -p projectatlas-cli --all-features --test "$target"
              cargo clippy --locked -p projectatlas-cli --all-features --test "$target" -- -D warnings
              cargo test --locked -p projectatlas-cli --all-features --test "$target"
            done
          else
            if [[ "$mode" == "full" ]]; then
              cargo check --workspace --all-targets --all-features --locked
              cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
              cargo test --workspace --all-features --locked
            else
              cargo check "${package_args[@]}" --lib --bins --examples --all-features --locked
              cargo clippy "${package_args[@]}" --lib --bins --examples --all-features --locked -- -D warnings
              cargo test "${package_args[@]}" --lib --bins --all-features --locked
              for target in "${targets[@]}"; do
                cargo check --locked -p projectatlas-cli --all-features --test "$target"
                cargo clippy --locked -p projectatlas-cli --all-features --test "$target" -- -D warnings
                cargo test --locked -p projectatlas-cli --all-features --test "$target"
              done
            fi
            if [[ "$mode" == "full" ]]; then
              cargo test --workspace --doc --all-features --locked
              RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features --locked
            else
              cargo test --doc "${package_args[@]}" --all-features --locked
              RUSTDOCFLAGS="-D warnings" cargo doc "${package_args[@]}" --no-deps --all-features --locked
            fi
          fi
          if [[ "$filtered_custom_harness" == "true" ]]; then
            cargo test --locked -p projectatlas-cli --all-features --test parser_supervisor_adversarial task_errors_classify_only_typed_cancellation_as_canceled
          fi

      - name: Dependency policy
        if: contains(fromJSON(needs.plan.outputs.plan).repository_contracts, 'cargo-dependency')
        run: cargo deny --locked --all-features check -D warnings

  e2e-smoke:
    name: e2e-smoke ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.platform == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.platform_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.head }}

      - name: Rust toolchain preflight
        shell: bash
        run: |
          python3 .github/scripts/verify-rust-toolchain.py --self-test
          python3 .github/scripts/verify-rust-toolchain.py --install

      - name: Affected package target compile
        # Full Linux compiles in rust; full macOS compiles in the all-targets warning gate.
        if: contains(matrix.contracts, 'compile') && (fromJSON(needs.plan.outputs.plan).mode == 'narrow' || runner.os == 'Windows')
        timeout-minutes: 10
        shell: bash
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(python3 -c 'import json,os,sys; sys.stdout.buffer.write("\n".join(json.loads(os.environ["PLAN"])["rust_packages"]).encode())')
          mapfile -t targets < <(python3 -c 'import json,os,sys; sys.stdout.buffer.write("\n".join(json.loads(os.environ["PLAN"])["test_targets"]).encode())')
          mode="$(python3 -c 'import json,os; print(json.loads(os.environ["PLAN"])["mode"])')"
          package_args=()
          for package in "${packages[@]}"; do
            case "$package" in
              projectatlas-core|projectatlas-db|projectatlas-fs|projectatlas-lints|projectatlas-service|projectatlas-symbols|projectatlas-cli) package_args+=(-p "$package") ;;
              *) echo "planner emitted unknown Rust package: $package" >&2; exit 1 ;;
            esac
          done
          target_args=()
          for target in "${targets[@]}"; do
            case "$target" in
              e2e_delivery|e2e_lifecycle|e2e_maintenance|e2e_navigation|e2e_worktrees|installer_trust_boundaries|language_runtime_compatibility|lint_diagnostics|optional_parser_worker_failure|optional_parser_worker_platform|parser_launch_authority|parser_supervisor_adversarial) target_args+=(--test "$target") ;;
              *) echo "planner emitted unknown Rust test target: $target" >&2; exit 1 ;;
            esac
          done
          if [[ "$mode" == "full" ]]; then
            cargo check --workspace --all-targets --all-features --locked
            exit 0
          fi
          if (( ${#package_args[@]} == 0 )); then
            echo "target compile contract has no affected package" >&2
            exit 1
          fi
          cargo check "${package_args[@]}" --lib --bins --examples --all-features --locked
          if (( ${#target_args[@]} > 0 )); then
            cargo check -p projectatlas-cli "${target_args[@]}" --all-features --locked
          fi

      - name: macOS all-features warning gate
        if: runner.os == 'macOS' && contains(matrix.contracts, 'mac-quality')
        timeout-minutes: 15
        shell: bash
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: macOS optional parser worker platform regression
        if: runner.os == 'macOS' && contains(matrix.contracts, 'parser')
        timeout-minutes: 15
        shell: bash
        run: cargo test --locked -p projectatlas-cli --all-features --test optional_parser_worker_platform

      - name: Holistic classified worktree agent E2E
        if: contains(matrix.contracts, 'worktree')
        timeout-minutes: 10
        run: cargo test --locked -p projectatlas-cli --test e2e_worktrees holistic_agent_worktree_flow_keeps_local_atlases_isolated_across_cli_watch_and_mcp -- --exact --include-ignored --nocapture

      - name: Causal E2E process observer deadline regression
        if: contains(matrix.contracts, 'process')
        timeout-minutes: 10
        run: cargo test --locked -p projectatlas-cli --test e2e_delivery e2e_process_observers_ -- --nocapture

      - name: Graph, symbol, purpose, and viewport regressions
        if: contains(matrix.contracts, 'navigation')
        timeout-minutes: 10
        shell: bash
        run: |
          cargo test --locked -p projectatlas-cli --test e2e_navigation csharp_symbol_identity_boundary_preserves_full_and_incremental_publication -- --exact --include-ignored --nocapture
          cargo test --locked -p projectatlas-cli --test e2e_navigation deep_qualified_symbol_parents_preserve_full_and_incremental_publication -- --exact --include-ignored --nocapture
          cargo test --locked -p projectatlas-cli --test e2e_navigation typed_identity_rejections_are_serialized_by_cli_and_mcp_coverage -- --exact --nocapture
          cargo test --locked -p projectatlas-cli --test e2e_navigation partial_markdown_limit_persists_without_losing_complete_publication -- --exact --include-ignored --nocapture
          cargo test --locked -p projectatlas-cli --test e2e_maintenance lint_formats_share_typed_cli_and_mcp_report -- --exact --include-ignored --nocapture
          cargo test --locked -p projectatlas-cli --test e2e_navigation classified_document_navigation_agrees_across_cli_and_mcp -- --exact --include-ignored --nocapture
          cargo test --locked -p projectatlas-cli --test e2e_maintenance conditional_purpose_review_cli_reconciles_source_before_apply -- --exact --include-ignored --nocapture
          cargo test --locked -p projectatlas-cli --test e2e_maintenance persistent_mcp_purpose_review_reconciles_source_before_apply -- --exact --include-ignored --nocapture
          cargo test --locked -p projectatlas-cli --test e2e_maintenance token_tui_cli_respects_selected_terminal_viewport -- --exact --include-ignored --nocapture
          cargo test --locked -p projectatlas-cli token_tui::tests -- --nocapture

      - name: Capture hosted PTY token dashboards
        if: matrix.label != 'windows' && contains(matrix.contracts, 'tui')
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/.tmp/tui-hosted-${{ matrix.label }}"
          repo="$evidence/repo"
          binary="$GITHUB_WORKSPACE/target/debug/projectatlas"
          mkdir -p "$repo/src"
          git init -q "$repo"
          git -C "$repo" config user.email "ci@projectatlas.invalid"
          git -C "$repo" config user.name "ProjectAtlas CI"
          printf 'pub fn hosted_terminal_contract() {}\n' > "$repo/src/lib.rs"
          git -C "$repo" add src/lib.rs
          git -C "$repo" commit -qm "test: seed hosted terminal evidence"
          cargo build --locked -p projectatlas-cli
          (cd "$repo" && "$binary" --format json init --no-scan)
          (cd "$repo" && "$binary" --format json scan)
          export PROJECTATLAS_TUI_BINARY="$binary"
          export PROJECTATLAS_TUI_DB="$repo/.projectatlas/projectatlas.db"
          render='stty rows "$PROJECTATLAS_TUI_ROWS" cols "$PROJECTATLAS_TUI_COLUMNS"; export COLUMNS="$PROJECTATLAS_TUI_COLUMNS" LINES="$PROJECTATLAS_TUI_ROWS"; case "$PROJECTATLAS_TUI_CASE" in compact-overview) "$PROJECTATLAS_TUI_BINARY" --db "$PROJECTATLAS_TUI_DB" token --session "界" --view tui ;; full-overview) "$PROJECTATLAS_TUI_BINARY" --db "$PROJECTATLAS_TUI_DB" token --view tui --theme light ;; compact-trend|full-trend) "$PROJECTATLAS_TUI_BINARY" --db "$PROJECTATLAS_TUI_DB" token --view tui --trend month ;; *) exit 64 ;; esac'
          capture() {
            local name="$1" rows="$2" columns="$3" case_name="$4"
            local output="$evidence/$name.ansi"
            export PROJECTATLAS_TUI_ROWS="$rows"
            export PROJECTATLAS_TUI_COLUMNS="$columns"
            export PROJECTATLAS_TUI_CASE="$case_name"
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              script -q "$output" sh -c "$render"
            else
              script -q -e -c "$render" "$output"
            fi
            test -s "$output"
            grep -a -q "Token" "$output"
          }
          capture compact-overview-40x8 8 40 compact-overview
          capture full-overview-80x50 50 80 full-overview
          capture compact-trend-79x29 29 79 compact-trend
          capture full-trend-80x30 30 80 full-trend
          printf '%s\n' \
            'compact-overview-40x8.ansi: 40 columns x 8 rows, CJK session' \
            'full-overview-80x50.ansi: 80 columns x 50 rows, light theme' \
            'compact-trend-79x29.ansi: 79 columns x 29 rows' \
            'full-trend-80x30.ansi: 80 columns x 30 rows' \
            > "$evidence/manifest.txt"

      - name: Upload hosted PTY token dashboards
        if: matrix.label != 'windows' && contains(matrix.contracts, 'tui')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: token-tui-pty-${{ matrix.label }}
          path: |
            .tmp/tui-hosted-${{ matrix.label }}/*.ansi
            .tmp/tui-hosted-${{ matrix.label }}/manifest.txt
          if-no-files-found: error
          retention-days: 7

      - name: Native Btrfs database placement contract
        if: matrix.label == 'linux' && contains(matrix.contracts, 'btrfs')
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes btrfs-progs
          image="$RUNNER_TEMP/projectatlas-btrfs.img"
          mount_root="$RUNNER_TEMP/projectatlas-btrfs"
          subvolume="$mount_root/projectatlas-subvolume"
          mkdir -p "$mount_root"
          truncate -s 256M "$image"
          sudo mkfs.btrfs -f "$image"
          cleanup() {
            if mountpoint -q "$mount_root"; then
              sudo umount "$mount_root"
            fi
          }
          trap cleanup EXIT
          sudo mount -o loop "$image" "$mount_root"
          sudo btrfs subvolume create "$subvolume"
          sudo chown "$(id -u):$(id -g)" "$subvolume"
          cargo build --locked -p projectatlas-cli
          PROJECTATLAS_BTRFS_TEST_ROOT="$subvolume" \
          PROJECTATLAS_MCP_CONTRACT_EXECUTABLE="$GITHUB_WORKSPACE/target/debug/projectatlas" \
            cargo test --locked -p projectatlas-cli --test e2e_lifecycle linux_btrfs_subvolume_database_supports_cli_and_persistent_mcp_reopen -- --exact --include-ignored --nocapture

      - name: Worktree lifecycle race regressions
        if: contains(matrix.contracts, 'worktree')
        timeout-minutes: 10
        shell: bash
        run: |
          cargo test --locked -p projectatlas-db active_registration_guard -- --nocapture
          cargo test --locked -p projectatlas-cli registered_init_rejects_replaced_git_lifecycle_before_or_during_activation_and_binding -- --nocapture
          cargo test --locked -p projectatlas-cli final_retirement_does_not_import_replacement_lifecycle_telemetry -- --nocapture
          cargo test --locked -p projectatlas-cli retirement_reclassifies_identity_and_snapshot_failures_after_lifecycle_replacement -- --nocapture
          cargo test --locked -p projectatlas-cli registered_reset_and_binding_linearize_without_recreating_a_reset_winner -- --nocapture

      - name: Plugin installer E2E
        if: contains(matrix.contracts, 'plugin')
        timeout-minutes: 10
        run: cargo test --locked -p projectatlas-cli plugin_installer_writes_real_harness_configs --test e2e_delivery

      - name: Installer RC pin E2E
        if: contains(matrix.contracts, 'plugin')
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli installer_workflow_pin_reports_preserve_exact_rc_identity --test e2e_delivery

      - name: Plugin update E2E
        if: contains(matrix.contracts, 'plugin')
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli plugin_update_replaces_stale_runtime_configs_and_launches_new_mcp --test e2e_delivery

      - name: Plugin update non-official marketplace E2E
        if: contains(matrix.contracts, 'plugin')
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli plugin_update_skips_non_official_codex_marketplace --test e2e_delivery

      - name: Plugin update already-current marketplace E2E
        if: contains(matrix.contracts, 'plugin')
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli plugin_update_leaves_current_codex_marketplace_untouched --test e2e_delivery

      - name: Plugin update stale source manifest E2E
        if: contains(matrix.contracts, 'plugin')
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli plugin_update_repairs_current_codex_plugin_with_stale_source_manifest --test e2e_delivery

      - name: Plugin update restore-on-failure E2E
        if: contains(matrix.contracts, 'plugin')
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli plugin_update_restores_current_ref_marketplace_when_plugin_reinstall_fails --test e2e_delivery

      - name: Plugin update total-offline preservation E2E
        if: contains(matrix.contracts, 'plugin')
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli plugin_update_preserves_prior_integration_when_all_replacement_adds_fail --test e2e_delivery

      - name: Plugin update strict inventory E2E
        if: contains(matrix.contracts, 'plugin')
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli plugin_update_refuses_unavailable_or_ambiguous_inventory --test e2e_delivery

      - name: POSIX plugin inventory no-jq E2E
        if: matrix.label != 'windows' && contains(matrix.contracts, 'plugin')
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli posix_plugin_inventory_without_jq_rejects_split_object_fields --test e2e_delivery -- --exact

      - name: Plugin update concurrent rollback serialization E2E
        if: contains(matrix.contracts, 'plugin')
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli plugin_update_serializes_restore_before_the_next_installer_reads_state --test e2e_delivery

      - name: Windows plugin lock canonicalization failure E2E
        if: matrix.label == 'windows' && contains(matrix.contracts, 'plugin')
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli windows_plugin_update_fails_closed_when_lock_root_cannot_be_canonicalized --test e2e_delivery -- --exact

      - name: Plugin update retained recovery refusal E2E
        if: contains(matrix.contracts, 'plugin')
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli plugin_update_refuses_retained_recovery_state_before_mutation --test e2e_delivery

      - name: POSIX plugin restore trust-boundary E2E
        if: matrix.label != 'windows' && contains(matrix.contracts, 'plugin')
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli posix_plugin_restore_rejects_hostile_paths_and_retains_recovery_state --test e2e_delivery -- --exact

      - name: POSIX plugin lock crash and trust-boundary E2E
        if: matrix.label != 'windows' && contains(matrix.contracts, 'plugin')
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli posix_plugin_lock_rejects_indirection_and_survives_crash --test e2e_delivery -- --exact

      - name: Windows plugin snapshot trust-boundary E2E
        if: matrix.label == 'windows' && contains(matrix.contracts, 'plugin')
        timeout-minutes: 5
        shell: pwsh
        run: |
          cargo test --locked -p projectatlas-cli windows_plugin_restore_rejects_cache_junction_and_retains_recovery_snapshot --test e2e_delivery -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p projectatlas-cli windows_plugin_snapshot_rejects_reparse_above_codex_home_before_mutation --test e2e_delivery -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p projectatlas-cli windows_plugin_snapshot_cleanup_refuses_path_swap_without_outside_deletion --test e2e_delivery -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p projectatlas-cli windows_plugin_snapshot_cleanup_failure_retains_usable_direct_snapshot --test e2e_delivery -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p projectatlas-cli windows_plugin_restore_rejects_config_directory_and_retains_recovery_snapshot --test e2e_delivery -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows recovery config selection E2E
        if: matrix.label == 'windows' && contains(matrix.contracts, 'windows')
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli windows_installer_recovery_operation_preserves_config_selection --test e2e_delivery -- --exact

      - name: Windows locked runtime update E2E
        if: matrix.label == 'windows' && contains(matrix.contracts, 'windows')
        timeout-minutes: 5
        env:
          PROJECTATLAS_TEST_DISPOSABLE_RUNNER: ${{ runner.environment }}
        run: cargo test --locked -p projectatlas-cli windows_release_binary_installer_uses_versioned_runtime_when_stable_mirror_is_locked --test e2e_delivery -- --exact

      - name: Windows persisted User PATH E2E
        if: matrix.label == 'windows' && contains(matrix.contracts, 'windows')
        timeout-minutes: 5
        env:
          PROJECTATLAS_TEST_DISPOSABLE_RUNNER: ${{ runner.environment }}
          PROJECTATLAS_TEST_PERSIST_USER_PATH: "1"
        run: cargo test --locked -p projectatlas-cli windows_installer_fresh_path_probe_respects_machine_precedence --test e2e_delivery -- --exact

      - name: Windows stale MCP registry update E2E
        if: matrix.label == 'windows' && contains(matrix.contracts, 'windows')
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli windows_release_binary_installer_repairs_stale_mirror_without_registering_it --test e2e_delivery

      - name: Windows installer trust boundaries
        if: matrix.label == 'windows' && contains(matrix.contracts, 'windows')
        timeout-minutes: 10
        run: cargo test --locked -p projectatlas-cli --all-features --test installer_trust_boundaries

      - name: Windows obsolete MCP handoff E2E
        if: matrix.label == 'windows' && contains(matrix.contracts, 'windows')
        timeout-minutes: 10
        run: cargo test --locked -p projectatlas-cli --test e2e_delivery windows_installer_obsolete_mcp_handoff_ -- --test-threads=1

      - name: macOS unsupported parser-pack boundary E2E
        if: runner.os == 'macOS' && contains(matrix.contracts, 'parser')
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli parser_pack_supported_only_commands_refuse_unsupported_macos_before_state_access --test e2e_lifecycle

      - name: MCP project binding E2E
        if: contains(matrix.contracts, 'mcp')
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli mcp_server_stays_bound_to_one_project_database --test e2e_lifecycle

      - name: Persistent MCP Git config stdin E2E
        if: contains(matrix.contracts, 'mcp')
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli persistent_mcp_stdin_does_not_block_repository_startup_probes --test e2e_lifecycle

      - name: Bare-root database preflight E2E
        if: contains(matrix.contracts, 'mcp')
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli implicit_bare_root --test e2e_lifecycle -- --nocapture

      - name: Generated MCP database authority E2E
        if: contains(matrix.contracts, 'mcp')
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli generated_mcp_config_preserves_explicit_conventional_database_authority --test e2e_lifecycle -- --exact --nocapture

  verify:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'metadata-edit' || 'verify' }}
    if: always() && (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null)
    needs: [plan, repository, rust, e2e-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.head || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

      - name: Aggregate selected proof
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN: ${{ needs.plan.outputs.plan }}
          BASE: ${{ needs.plan.outputs.base }}
          HEAD_SHA: ${{ needs.plan.outputs.head }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          PLATFORM_RESULT: ${{ needs.e2e-smoke.result }}
        run: |
          set -euo pipefail
          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "proof planning concluded $PLAN_RESULT" >&2
            exit 1
          fi
          python3 .github/scripts/affected-ci-proof.py aggregate \
            --plan "$PLAN" \
            --base "$BASE" \
            --head "$HEAD_SHA" \
            --event "$EVENT_NAME" \
            --repository-result "$REPOSITORY_RESULT" \
            --rust-result "$RUST_RESULT" \
            --platform-result "$PLATFORM_RESULT"
