# Purpose: Verify ProjectAtlas Rust quality gates and multi-OS behavior tests.

name: 01-CI

# /**
#  * Purpose: Run Rust source, test, and build checks.
#  */

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  RUSTUP_TOOLCHAIN: "1.93.1"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUSTUP_TOOLCHAIN"

      - name: Install cargo-deny
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: cargo-deny@0.20.2

      - name: Issue reference check
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_TITLE="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.title // ""')"
          PR_BODY="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""')"
          PR_MILESTONE="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.milestone.number // ""')"
          text="$PR_TITLE $PR_BODY"
          if ! [[ "$text" =~ (#[0-9]+|GH-[0-9]+|[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[0-9]+) ]]; then
            echo "Pull request title or body must reference a GitHub issue." >&2
            exit 1
          fi
          if [[ -z "$PR_MILESTONE" ]]; then
            echo "Pull request must be assigned to a milestone." >&2
            exit 1
          fi

      - name: Issue checklist check
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/issue-checklists.py --self-test
          python3 .github/scripts/test-optional-parser-proof-inputs.py
          python3 .github/scripts/issue-checklists.py \
            --repo "$GITHUB_REPOSITORY" \
            --root . \
            --issue-map openspec/issue-map.json

      - name: Manual-only full benchmark policy
        run: python3 .github/scripts/verify-manual-benchmark-policy.py

      - name: Published benchmark measurement locks
        run: python3 .github/scripts/verify-published-benchmark-locks.py

      - name: Codex PR review thread gate
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 .github/scripts/codex-pr-review-gate.py --self-test
          python3 .github/scripts/codex-pr-review-gate.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER"

      - name: Format
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Rust source contract lints
        timeout-minutes: 2
        run: cargo run --locked -p projectatlas-lints --bin cargo-projectatlas-lints -- strict-strings

      - name: Dependency policy
        run: cargo deny --locked --all-features check -D warnings

      - name: Tests
        run: cargo test --workspace --all-features --locked

      - name: Filtered custom harness compatibility
        run: cargo test --locked -p projectatlas-cli --all-features task_errors_classify_only_typed_cancellation_as_canceled

      - name: Doc tests
        run: cargo test --doc --workspace --all-features --locked

      - name: Rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features --locked

  e2e-smoke:
    name: e2e-smoke ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-latest
          - label: windows
            os: windows-latest
          - label: macos-x64
            os: macos-15-intel
          - label: macos-arm64
            os: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"

      - name: Plugin installer E2E
        timeout-minutes: 10
        run: cargo test --locked -p projectatlas-cli plugin_installer_writes_real_harness_configs --test e2e

      - name: Plugin update E2E
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli plugin_update_replaces_stale_runtime_configs_and_launches_new_mcp --test e2e

      - name: Plugin update non-official marketplace E2E
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli plugin_update_skips_non_official_codex_marketplace --test e2e

      - name: Plugin update already-current marketplace E2E
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli plugin_update_leaves_current_codex_marketplace_untouched --test e2e

      - name: Plugin update stale source manifest E2E
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli plugin_update_repairs_current_codex_plugin_with_stale_source_manifest --test e2e

      - name: Plugin update restore-on-failure E2E
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli plugin_update_restores_current_ref_marketplace_when_plugin_reinstall_fails --test e2e

      - name: Windows locked runtime update E2E
        if: matrix.label == 'windows'
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli windows_release_binary_installer_uses_versioned_runtime_when_stable_mirror_is_locked --test e2e

      - name: Windows persisted User PATH E2E
        if: matrix.label == 'windows'
        timeout-minutes: 5
        env:
          PROJECTATLAS_TEST_DISPOSABLE_RUNNER: ${{ runner.environment }}
          PROJECTATLAS_TEST_PERSIST_USER_PATH: "1"
        run: cargo test --locked -p projectatlas-cli windows_installer_fresh_path_probe_respects_machine_precedence --test e2e -- --exact

      - name: Windows stale MCP registry update E2E
        if: matrix.label == 'windows'
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli windows_release_binary_installer_repairs_stale_mirror_without_registering_it --test e2e

      - name: Windows installer trust boundaries
        if: matrix.label == 'windows'
        timeout-minutes: 10
        run: cargo test --locked -p projectatlas-cli --all-features --test installer_trust_boundaries

      - name: macOS unsupported parser-pack boundary E2E
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli parser_pack_supported_only_commands_refuse_unsupported_macos_before_state_access --test e2e

      - name: MCP project binding E2E
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli mcp_server_stays_bound_to_one_project_database --test e2e

      - name: Persistent MCP Git config stdin E2E
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli persistent_mcp_stdin_does_not_block_repository_startup_probes --test e2e

      - name: Bare-root database preflight E2E
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli implicit_bare_root --test e2e -- --nocapture

      - name: Generated MCP database authority E2E
        timeout-minutes: 5
        run: cargo test --locked -p projectatlas-cli generated_mcp_config_preserves_explicit_conventional_database_authority --test e2e -- --exact --nocapture
