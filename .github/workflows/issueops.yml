name: 00-IssueOps

run-name: >-
  00-IssueOps /
  ${{ github.event_name == 'repository_dispatch'
      && format('relationship {0}', github.event.client_payload.request_id)
      || format('issue #{0}', github.event.issue.number) }}

on:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled, milestoned, demilestoned]
  repository_dispatch:
    types: [issueops_relationship]
  # Relationship clients use authenticated gh api repos/OWNER/REPO/dispatches
  # --method POST -f event_type=issueops_relationship -f client_payload='...'.
  # Generate a unique 8-64 character ASCII request_id and include it in the
  # payload, for example:
  # gh api repos/OWNER/REPO/dispatches --method POST -f event_type=issueops_relationship \
  #   -f client_payload='{"request_id":"rel-20260823-001","relation_kind":"sub_issue","operation":"remove","issue_number":492,"related_issue_number":339}'
  # The 204 dispatch response is admission only.
  # dispatch admission is not run success: locate the run by its
  # `relationship <request_id>` name, require a successful conclusion, and
  # read back the native relation. Reuse the same request_id for an idempotent
  # retry after cancellation/failure; a canceled or overflowed run applied no
  # authoritative outcome unless the native read-back proves otherwise.

permissions:
  contents: read
  issues: read

jobs:
  planned-issue:
    name: planned-issue-readiness
    if: >
      (github.event_name == 'issues' && github.event.issue.milestone != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate IssueOps contract
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          npm ci --ignore-scripts --prefix .github/mermaid-parser
          npm audit --omit=dev --audit-level=moderate --prefix .github/mermaid-parser
          python3 .github/scripts/issue-checklists.py --self-test
          python3 .github/scripts/issue-checklists.py \
            --repo "$GITHUB_REPOSITORY" \
            --root . \
            --issue-map openspec/issue-map.json \
            --planned-issue "$ISSUE_NUMBER"

  implementation-status-invalidation:
    name: implementation-status-invalidation
    if: >
      github.event_name == 'issues' ||
      github.event_name == 'repository_dispatch'
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Invalidate implementation statuses
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
        run: |
          python3 .github/scripts/issue-checklists.py --self-test
          python3 .github/scripts/issue-checklists.py \
            --repo "$GITHUB_REPOSITORY" \
            --root . \
            --issue-map openspec/issue-map.json \
            --invalidate-implementation-statuses-for-issue "$ISSUE_NUMBER" \
            --reconcile-all-release-graphs

  implementation-status-revalidation:
    name: implementation-status-revalidation
    needs: implementation-status-invalidation
    if: >
      github.event_name == 'issues' ||
      github.event_name == 'repository_dispatch'
    # Native concurrency serializes publishers with a bounded pending queue; it is not correctness.
    # A queued relationship dispatch has not mutated; capacity cancellation is visibly retryable.
    # Every queued publisher reconciles all declared release-graph PRs from live state.
    concurrency:
      group: issueops-implementation-revalidation-${{ github.repository }}
      queue: max
    permissions:
      contents: read
      issues: write
      pull-requests: read
      statuses: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Prepare IssueOps parser
        run: |
          npm ci --ignore-scripts --prefix .github/mermaid-parser
          npm audit --omit=dev --audit-level=moderate --prefix .github/mermaid-parser
          python3 .github/scripts/issue-checklists.py --self-test

      - name: Publish affected implementation statuses
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
          REQUEST_ID: ${{ github.event.client_payload.request_id || '' }}
          RELATION_KIND: ${{ github.event.client_payload.relation_kind || 'none' }}
          RELATION_OPERATION: ${{ github.event.client_payload.operation || 'none' }}
          RELATED_ISSUE: ${{ github.event.client_payload.related_issue_number || '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" && ! "$REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{7,63}$ ]]; then
            echo "repository_dispatch requires a valid 8-64 character request_id" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" && "$RELATION_KIND" == "none" ]]; then
            echo "repository_dispatch requires an authorized native relationship payload" >&2
            exit 1
          fi
          if [[ "$RELATION_KIND" == "none" && "$RELATION_OPERATION" != "none" ]] || \
             [[ "$RELATION_KIND" != "none" && "$RELATION_OPERATION" == "none" ]] || \
             [[ "$RELATION_KIND" != "none" && -z "$RELATED_ISSUE" ]]; then
            echo "relation kind, operation, and related issue must be supplied together" >&2
            exit 1
          fi
          if [[ "$RELATION_KIND" != "none" ]]; then
            python3 .github/scripts/issue-checklists.py \
              --repo "$GITHUB_REPOSITORY" \
              --root . \
              --issue-map openspec/issue-map.json \
              --mutate-native-relationship \
              --native-relationship-kind "$RELATION_KIND" \
              --native-relationship-operation "$RELATION_OPERATION" \
              --native-relationship-issue "$ISSUE_NUMBER" \
              --native-related-issue "$RELATED_ISSUE" \
              --request-id "$REQUEST_ID" \
              --run-id "$GITHUB_RUN_ID"
            exit 0
          fi
          python3 .github/scripts/issue-checklists.py \
            --repo "$GITHUB_REPOSITORY" \
            --root . \
            --issue-map openspec/issue-map.json \
            --publish-implementation-statuses-for-issue "$ISSUE_NUMBER" \
            --reconcile-all-release-graphs \
            --enforce-closed-issue-blockers "$ISSUE_NUMBER" \
            --run-id "$GITHUB_RUN_ID"
