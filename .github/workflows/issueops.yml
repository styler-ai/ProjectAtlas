name: 00-IssueOps

on:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled, milestoned, demilestoned]
  workflow_dispatch:
    inputs:
      issue:
        description: "Open issue number to validate for release-milestone readiness"
        required: true
        type: number

permissions:
  contents: read
  issues: read

jobs:
  planned-issue:
    name: planned-issue-readiness
    if: github.event_name == 'workflow_dispatch' || github.event.issue.milestone != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate IssueOps contract
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
        run: |
          npm ci --ignore-scripts --prefix .github/mermaid-parser
          npm audit --omit=dev --audit-level=moderate --prefix .github/mermaid-parser
          python3 .github/scripts/issue-checklists.py --self-test
          python3 .github/scripts/issue-checklists.py \
            --repo "$GITHUB_REPOSITORY" \
            --root . \
            --issue-map openspec/issue-map.json \
            --planned-issue "$ISSUE_NUMBER"

  implementation-gate-revalidation:
    name: implementation-gate-revalidation
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
      (github.event.action == 'edited' || github.event.action == 'reopened' ||
      github.event.action == 'closed' || github.event.action == 'milestoned' ||
      github.event.action == 'demilestoned'))
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Revalidate affected implementation PR gates
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
        run: |
          python3 .github/scripts/issue-checklists.py \
            --repo "$GITHUB_REPOSITORY" \
            --issue-map openspec/issue-map.json \
            --enforce-closed-issue-blockers "$ISSUE_NUMBER"
          python3 .github/scripts/issue-checklists.py \
            --repo "$GITHUB_REPOSITORY" \
            --issue-map openspec/issue-map.json \
            --rerun-implementation-gates-for-issue "$ISSUE_NUMBER"
