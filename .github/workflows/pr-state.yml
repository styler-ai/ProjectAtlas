# Purpose: Validate trusted pull-request metadata and wake the exact-head publisher.

name: PR state
run-name: ${{ github.event_name == 'pull_request_target' && format('pr-state-wakeup|{0}|{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || 'PR state issue refresh' }}

on:
  pull_request_target:
    branches: [main, dev]
    types: [opened, reopened, synchronize, edited, milestoned, demilestoned]
  issues:
    types: [closed, reopened, edited, labeled, unlabeled, milestoned, demilestoned]

concurrency:
  group: projectatlas-pr-state-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  pr-state-wakeup:
    name: pr-state-wakeup
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Record trusted PR-state snapshot
        run: echo "Trusted PR-state wakeup received."

  refresh-pr-state:
    name: refresh-pr-state
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Refresh affected pull-request state
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: >-
          python3 .github/scripts/issue-checklists.py
          --repo "$GITHUB_REPOSITORY"
          --refresh-pr-state-for-issue "$ISSUE_NUMBER"
