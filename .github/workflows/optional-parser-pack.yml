name: optional-parser-pack

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: optional-parser-pack-${{ github.sha }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: 1.93.1

jobs:
  construct:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'optional-parser-pack-proof'
    name: construct ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            isolation: linux-network-namespace
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            isolation: windows-app-container
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default $env:RUSTUP_TOOLCHAIN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bind exact clean candidate identity
        id: identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $revision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -ne $env:GITHUB_SHA) {
            throw "Checkout revision does not equal GITHUB_SHA."
          }
          $status = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $status.Count -ne 0) {
            throw "Parser-pack construction requires an exact clean checkout."
          }
          $credentialConfig = @(
            git config --local --get-regexp `
              '^(http\..*\.extraheader|credential\.|url\..*\.insteadof)' 2>$null
          )
          $credentialConfigExit = $LASTEXITCODE
          if (($credentialConfigExit -ne 0 -and $credentialConfigExit -ne 1) -or
              $credentialConfig.Count -ne 0) {
            throw "Candidate checkout contains credential-bearing local Git configuration."
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json -Depth 64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packageVersions = @(
            $metadata.packages |
              Where-Object { $_.name -like "projectatlas-*" } |
              ForEach-Object { [string]$_.version } |
              Sort-Object -Unique
          )
          if ($packageVersions.Count -ne 1) {
            throw "ProjectAtlas workspace packages do not share one version."
          }
          $accepted = Get-Content -Raw -LiteralPath "packaging/parser-pack/accepted-capabilities.json" |
            ConvertFrom-Json -Depth 64
          $intendedVersion = [string]$accepted.runtime.projectatlas_version
          if ($packageVersions[0] -ne $intendedVersion) {
            throw "Workspace package version does not match the accepted parser-pack release."
          }

          $rustcLines = @(rustc -vV)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rustcRelease = ($rustcLines | Where-Object { $_ -match '^release: ' }) -replace '^release: ', ''
          $rustcCommit = ($rustcLines | Where-Object { $_ -match '^commit-hash: ' }) -replace '^commit-hash: ', ''
          $rustcHost = ($rustcLines | Where-Object { $_ -match '^host: ' }) -replace '^host: ', ''
          if ($rustcHost -ne "${{ matrix.target }}") {
            throw "Pinned Rust host does not match the workflow target."
          }
          $lockSha = (Get-FileHash -Algorithm SHA256 -LiteralPath "Cargo.lock").Hash.ToLowerInvariant()
          $toolchainRoot = (rustc --print sysroot).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pwshPath = [System.Diagnostics.Process]::GetCurrentProcess().MainModule.FileName

          "revision=$revision" >> $env:GITHUB_OUTPUT
          "cargo_package_version=$($packageVersions[0])" >> $env:GITHUB_OUTPUT
          "intended_release_version=$intendedVersion" >> $env:GITHUB_OUTPUT
          "cargo_lock_sha256=$lockSha" >> $env:GITHUB_OUTPUT
          "rustc_release=$rustcRelease" >> $env:GITHUB_OUTPUT
          "rustc_commit_hash=$rustcCommit" >> $env:GITHUB_OUTPUT
          "toolchain_root=$toolchainRoot" >> $env:GITHUB_OUTPUT
          "pwsh_path=$pwshPath" >> $env:GITHUB_OUTPUT

      - name: Test bounded construction diagnostics
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/test-parser-pack-construction-diagnostics.ps1

      - name: Prove baseline network reachability
        id: network
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $checker = ".github/scripts/check-parser-pack-network-boundary.ps1"
          $discovery = pwsh -NoProfile -File $checker -Mode discover-resolver | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File $checker -Mode require-reachable -ResolverAddress $discovery.resolver_address
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "resolver_address=$($discovery.resolver_address)" >> $env:GITHUB_OUTPUT

      - name: Acquire pinned inputs and vendor dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $inputs = Join-Path $env:RUNNER_TEMP "parser-pack-inputs"
          $cargoHome = Join-Path $env:RUNNER_TEMP "parser-pack-cargo-home"
          $vendor = Join-Path $env:RUNNER_TEMP "parser-pack-vendor"
          $output = Join-Path $env:RUNNER_TEMP "parser-pack-output"
          $containedTemp = Join-Path $env:RUNNER_TEMP "parser-pack-contained-temp"
          $containedHome = Join-Path $env:RUNNER_TEMP "parser-pack-contained-home"
          foreach ($directory in @($cargoHome, $output, $containedTemp, $containedHome)) {
            [System.IO.Directory]::CreateDirectory($directory) | Out-Null
          }
          pwsh -NoProfile -File .github/scripts/acquire-parser-pack-inputs.ps1 `
            -Target "${{ matrix.target }}" `
            -SourceManifest packaging/parser-pack/sources/tree-sitter-language-pack-1.13.2-platform-bundles.json `
            -Destination $inputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $vendorConfig = cargo vendor --locked --versioned-dirs $vendor | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [System.IO.File]::WriteAllText(
            (Join-Path $cargoHome "config.toml"),
            $vendorConfig,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Build standalone Windows AppContainer launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcherDirectory = Join-Path $env:RUNNER_TEMP "parser-pack-appcontainer"
          [System.IO.Directory]::CreateDirectory($launcherDirectory) | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File .github/scripts/build-parser-pack-appcontainer-launcher.ps1 `
            -OutputPath (Join-Path $launcherDirectory "launcher.exe") `
            -RunSelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Construct inside Linux network namespace
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          toolchain_root='${{ steps.identity.outputs.toolchain_root }}'
          pwsh_path='${{ steps.identity.outputs.pwsh_path }}'
          setpriv_path="$(command -v setpriv)"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          cd "$GITHUB_WORKSPACE"
          sudo --non-interactive unshare --net -- \
            "$setpriv_path" --no-new-privs --reuid="$runner_uid" --regid="$runner_gid" --clear-groups \
            /usr/bin/env -i \
              HOME="$RUNNER_TEMP/parser-pack-contained-home" \
              CARGO_HOME="$RUNNER_TEMP/parser-pack-cargo-home" \
              PATH="$toolchain_root/bin:/usr/bin:/bin" \
              TMPDIR="$RUNNER_TEMP/parser-pack-contained-temp" \
              CARGO_INCREMENTAL=0 \
              CARGO_TERM_COLOR=never \
            "$pwsh_path" -NoLogo -NoProfile -NonInteractive \
              -File "$GITHUB_WORKSPACE/.github/scripts/run-parser-pack-contained-construction.ps1" \
              -Target '${{ matrix.target }}' \
              -SourceRoot "$GITHUB_WORKSPACE" \
              -InputDirectory "$RUNNER_TEMP/parser-pack-inputs" \
              -OutputDirectory "$RUNNER_TEMP/parser-pack-output" \
              -ProjectAtlasRevision '${{ steps.identity.outputs.revision }}' \
              -CargoPackageVersion '${{ steps.identity.outputs.cargo_package_version }}' \
              -IntendedReleaseVersion '${{ steps.identity.outputs.intended_release_version }}' \
              -CargoLockSha256 '${{ steps.identity.outputs.cargo_lock_sha256 }}' \
              -RustcRelease '${{ steps.identity.outputs.rustc_release }}' \
              -RustcCommitHash '${{ steps.identity.outputs.rustc_commit_hash }}' \
              -NetworkIsolation '${{ matrix.isolation }}' \
              -ResolverAddress '${{ steps.network.outputs.resolver_address }}'

      - name: Construct inside Windows AppContainer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Get-RuleRightsMask {
            param(
              [Parameter(Mandatory)] $Rules,
              [Parameter(Mandatory)] [System.Security.Principal.SecurityIdentifier] $Sid,
              [Parameter(Mandatory)] [System.Security.AccessControl.AccessControlType] $Type
            )
            [int64]$mask = 0
            foreach ($rule in $Rules) {
              if ($rule.AccessControlType -eq $Type -and $rule.IdentityReference -eq $Sid) {
                $mask = $mask -bor [int64]$rule.FileSystemRights
              }
            }
            return "0x{0:x}" -f $mask
          }

          function Write-ContainedFileSecuritySummary {
            param(
              [Parameter(Mandatory)] [string] $Role,
              [Parameter(Mandatory)] [string] $Path
            )
            try {
              $item = Get-Item -LiteralPath $Path -Force
              if ($item.PSIsContainer -or
                  (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0)) {
                throw "unsafe-file"
              }
              $acl = Get-Acl -LiteralPath $item.FullName
              $rules = @($acl.GetAccessRules(
                $true,
                $true,
                [System.Security.Principal.SecurityIdentifier]
              ))
              $accessSddl = $acl.GetSecurityDescriptorSddlForm(
                [System.Security.AccessControl.AccessControlSections]::Access
              )
              $sha256 = [System.Security.Cryptography.SHA256]::Create()
              try {
                $aclDigest = [System.Convert]::ToHexString(
                  $sha256.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($accessSddl))
                ).ToLowerInvariant()
              }
              finally {
                $sha256.Dispose()
              }
              $principals = [ordered]@{
                everyone = [System.Security.Principal.SecurityIdentifier]::new("S-1-1-0")
                all_packages = [System.Security.Principal.SecurityIdentifier]::new("S-1-15-2-1")
                restricted_packages = [System.Security.Principal.SecurityIdentifier]::new("S-1-15-2-2")
                launch_user = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
              }
              $parts = [System.Collections.Generic.List[string]]::new()
              foreach ($entry in $principals.GetEnumerator()) {
                $allow = Get-RuleRightsMask `
                  -Rules $rules `
                  -Sid $entry.Value `
                  -Type ([System.Security.AccessControl.AccessControlType]::Allow)
                $deny = Get-RuleRightsMask `
                  -Rules $rules `
                  -Sid $entry.Value `
                  -Type ([System.Security.AccessControl.AccessControlType]::Deny)
                $parts.Add("$($entry.Key)_allow=$allow")
                $parts.Add("$($entry.Key)_deny=$deny")
              }
              $zoneIdentifier = $null -ne (Get-Item `
                -LiteralPath $item.FullName `
                -Stream "Zone.Identifier" `
                -ErrorAction SilentlyContinue)
              $signature = (Get-AuthenticodeSignature -LiteralPath $item.FullName).Status
              $explicitAllow = @($rules | Where-Object {
                -not $_.IsInherited -and $_.AccessControlType -eq "Allow"
              }).Count
              $explicitDeny = @($rules | Where-Object {
                -not $_.IsInherited -and $_.AccessControlType -eq "Deny"
              }).Count
              $inheritedAllow = @($rules | Where-Object {
                $_.IsInherited -and $_.AccessControlType -eq "Allow"
              }).Count
              $inheritedDeny = @($rules | Where-Object {
                $_.IsInherited -and $_.AccessControlType -eq "Deny"
              }).Count
              Write-Host (
                "[contained-security] role=$Role attributes=$([int]$item.Attributes) " +
                "acl_protected=$($acl.AreAccessRulesProtected.ToString().ToLowerInvariant()) " +
                "acl_digest=$aclDigest explicit_allow=$explicitAllow explicit_deny=$explicitDeny " +
                "inherited_allow=$inheritedAllow inherited_deny=$inheritedDeny " +
                "zone_identifier=$($zoneIdentifier.ToString().ToLowerInvariant()) " +
                "signature=$signature $($parts -join ' ')"
              )
            }
            catch {
              Write-Host "[contained-security] role=$Role state=unavailable"
            }
          }

          function Write-ContainedPolicyEventSummary {
            param(
              [Parameter(Mandatory)] [string] $Role,
              [Parameter(Mandatory)] [string] $LogName,
              [Parameter(Mandatory)] [datetime] $StartTime
            )
            try {
              $events = @(Get-WinEvent `
                -FilterHashtable @{ LogName = $LogName; StartTime = $StartTime } `
                -MaxEvents 128 `
                -ErrorAction Stop)
              $counts = @(
                $events |
                  Group-Object Id |
                  Sort-Object { [int]$_.Name } |
                  ForEach-Object { "$($_.Name):$($_.Count)" }
              )
              $summary = if ($counts.Count -eq 0) { "none" } else { $counts -join "," }
              Write-Host "[contained-security] role=$Role event_ids=$summary"
            }
            catch {
              Write-Host "[contained-security] role=$Role state=unavailable"
            }
          }

          $programFilesX86 = [System.Environment]::GetFolderPath(
            [System.Environment+SpecialFolder]::ProgramFilesX86
          )
          $vswhere = Join-Path $programFilesX86 "Microsoft Visual Studio/Installer/vswhere.exe"
          $vsInstall = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "Visual Studio C++ toolchain was not found."
          }
          Import-Module (Join-Path $vsInstall "Common7/Tools/Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vsInstall -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64" | Out-Null

          $source = $env:GITHUB_WORKSPACE
          $inputs = Join-Path $env:RUNNER_TEMP "parser-pack-inputs"
          $vendor = Join-Path $env:RUNNER_TEMP "parser-pack-vendor"
          $output = Join-Path $env:RUNNER_TEMP "parser-pack-output"
          $cargoHome = Join-Path $env:RUNNER_TEMP "parser-pack-cargo-home"
          $containedTemp = Join-Path $env:RUNNER_TEMP "parser-pack-contained-temp"
          $containedHome = Join-Path $env:RUNNER_TEMP "parser-pack-contained-home"
          $launcher = Join-Path $env:RUNNER_TEMP "parser-pack-appcontainer/launcher.exe"
          $toolchainRoot = '${{ steps.identity.outputs.toolchain_root }}'
          $toolchainBin = Join-Path $toolchainRoot "bin"
          $pwshPath = '${{ steps.identity.outputs.pwsh_path }}'
          $pwshRoot = Split-Path -Parent $pwshPath
          $vcTools = $env:VCToolsInstallDir.TrimEnd('\')
          $windowsSdk = $env:WindowsSdkDir.TrimEnd('\')
          $windowsSdkVersion = $env:WindowsSDKVersion.TrimEnd('\')
          $msvcBin = Join-Path $vcTools "bin/Hostx64/x64"
          $sdkBin = Join-Path $windowsSdk "bin/$windowsSdkVersion/x64"
          $boundedPath = @(
            $toolchainBin,
            $msvcBin,
            $sdkBin,
            (Join-Path $env:SystemRoot "System32"),
            $env:SystemRoot
          ) -join ';'
          foreach ($requiredEnvironment in @("INCLUDE", "LIB", "LIBPATH")) {
            if ([string]::IsNullOrWhiteSpace([System.Environment]::GetEnvironmentVariable($requiredEnvironment))) {
              throw "Visual Studio environment is missing $requiredEnvironment."
            }
          }

          # Rustup may install protected/non-inheriting ACLs on both rustc and its adjacent
          # runtime DLLs. Admit only that bounded loader closure, not the whole toolchain tree.
          $toolchainExecuteFiles = @(
            (Join-Path $toolchainBin "rustc.exe")
            Get-ChildItem -LiteralPath $toolchainBin -Filter "*.dll" -File |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          )

          $launcherArguments = @(
            "launch",
            "--executable", $pwshPath,
            "--working-directory", $source,
            "--temp-directory", $containedTemp,
            "--timeout-seconds", "3600",
            "--read-root", $source,
            "--read-root", $inputs,
            "--read-root", $vendor,
            "--read-root", $pwshRoot,
            "--read-root", $toolchainRoot,
            "--read-root", $vcTools,
            "--read-root", $windowsSdk
          )
          foreach ($toolchainExecuteFile in $toolchainExecuteFiles) {
            $launcherArguments += @("--execute-file", $toolchainExecuteFile)
          }
          $launcherArguments += @(
            "--write-root", $output,
            "--write-root", $cargoHome,
            "--write-root", $containedTemp,
            "--write-root", $containedHome,
            "--environment", "CARGO_HOME=$cargoHome",
            "--environment", "HOME=$containedHome",
            "--environment", "PATH=$boundedPath",
            "--environment", "RUSTC=$(Join-Path $toolchainBin 'rustc.exe')",
            "--environment", "INCLUDE=$env:INCLUDE",
            "--environment", "LIB=$env:LIB",
            "--environment", "LIBPATH=$env:LIBPATH",
            "--environment", "CARGO_INCREMENTAL=0",
            "--environment", "CARGO_TERM_COLOR=never",
            "--",
            "-NoLogo",
            "-NoProfile",
            "-NonInteractive",
            "-ExecutionPolicy", "Bypass",
            "-File", (Join-Path $source ".github/scripts/run-parser-pack-contained-construction.ps1"),
            "-Target", "${{ matrix.target }}",
            "-SourceRoot", $source,
            "-InputDirectory", $inputs,
            "-OutputDirectory", $output,
            "-ProjectAtlasRevision", "${{ steps.identity.outputs.revision }}",
            "-CargoPackageVersion", "${{ steps.identity.outputs.cargo_package_version }}",
            "-IntendedReleaseVersion", "${{ steps.identity.outputs.intended_release_version }}",
            "-CargoLockSha256", "${{ steps.identity.outputs.cargo_lock_sha256 }}",
            "-RustcRelease", "${{ steps.identity.outputs.rustc_release }}",
            "-RustcCommitHash", "${{ steps.identity.outputs.rustc_commit_hash }}",
            "-NetworkIsolation", "${{ matrix.isolation }}",
            "-ResolverAddress", "${{ steps.network.outputs.resolver_address }}"
          )
          $constructionStartedAt = Get-Date
          & $launcher @launcherArguments
          $containedExitCode = $LASTEXITCODE
          if ($containedExitCode -ne 0) {
            Write-ContainedFileSecuritySummary `
              -Role "cargo" `
              -Path (Join-Path $toolchainBin "cargo.exe")
            for ($index = 0; $index -lt $toolchainExecuteFiles.Count; $index++) {
              $role = if ($index -eq 0) { "rustc" } else { "runtime-dll-$($index - 1)" }
              Write-ContainedFileSecuritySummary `
                -Role $role `
                -Path $toolchainExecuteFiles[$index]
            }
            Write-ContainedPolicyEventSummary `
              -Role "applocker" `
              -LogName "Microsoft-Windows-AppLocker/EXE and DLL" `
              -StartTime $constructionStartedAt
            Write-ContainedPolicyEventSummary `
              -Role "code-integrity" `
              -LogName "Microsoft-Windows-CodeIntegrity/Operational" `
              -StartTime $constructionStartedAt
            $validatedStage = $null
            $validatedExitCode = $null
            try {
              $statusPath = Join-Path $output "construction-status.json"
              $statusItem = Get-Item -LiteralPath $statusPath -Force
              if ($statusItem.PSIsContainer -or
                  (($statusItem.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) -or
                  $statusItem.Length -le 0 -or
                  $statusItem.Length -gt 1024) {
                throw "invalid-status-file"
              }
              $status = [System.IO.File]::ReadAllText($statusItem.FullName) |
                ConvertFrom-Json -Depth 4
              if ($status -isnot [pscustomobject]) {
                throw "invalid-status-shape"
              }
              $actualKeys = @($status.PSObject.Properties.Name | Sort-Object)
              $expectedKeys = @("exit_code", "schema_version", "stage", "state")
              if (Compare-Object -ReferenceObject $expectedKeys -DifferenceObject $actualKeys) {
                throw "invalid-status-keys"
              }
              $allowedStages = @(
                "validate-inputs",
                "network-denial-canaries",
                "output-preparation",
                "optional-parser-worker-build",
                "artifact-assembler-build",
                "release-verifier-build",
                "runtime-containment-broker-build",
                "artifact-input-validation",
                "artifact-assembly-a",
                "archive-creation-a",
                "artifact-assembly-b",
                "archive-creation-b",
                "deterministic-archive-comparison",
                "publication"
              )
              $integerTypes = @([int], [long])
              if ($integerTypes -notcontains $status.schema_version.GetType() -or
                  $status.schema_version -ne 1 -or
                  $status.state -ne "failed" -or
                  $allowedStages -notcontains $status.stage -or
                  $integerTypes -notcontains $status.exit_code.GetType() -or
                  $status.exit_code -eq 0 -or
                  $status.exit_code -lt [int]::MinValue -or
                  $status.exit_code -gt [int]::MaxValue) {
                throw "invalid-status-values"
              }
              $validatedStage = [string]$status.stage
              $validatedExitCode = [int]$status.exit_code

              $diagnosticPath = Join-Path $output "construction-diagnostic.txt"
              if (Test-Path -LiteralPath $diagnosticPath) {
                $diagnosticItem = Get-Item -LiteralPath $diagnosticPath -Force
                if ($diagnosticItem.PSIsContainer -or
                    (($diagnosticItem.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) -or
                    $diagnosticItem.Length -le 0 -or
                    $diagnosticItem.Length -gt (64 * 1024)) {
                  throw "invalid-diagnostic-file"
                }
                $strictUtf8 = [System.Text.UTF8Encoding]::new($false, $true)
                $diagnostic = [System.IO.File]::ReadAllText($diagnosticItem.FullName, $strictUtf8)
                if ($diagnostic -match '[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]') {
                  throw "invalid-diagnostic-content"
                }
                foreach ($privatePath in @(
                  $env:RUNNER_TEMP,
                  $source,
                  $inputs,
                  $vendor,
                  $output,
                  $cargoHome,
                  $containedTemp,
                  $containedHome,
                  $toolchainRoot,
                  $pwshRoot,
                  $vcTools,
                  $windowsSdk
                )) {
                  if (-not [string]::IsNullOrWhiteSpace($privatePath)) {
                    $diagnostic = $diagnostic.Replace($privatePath, "<runner-path>")
                  }
                }
                foreach ($line in [System.Text.RegularExpressions.Regex]::Split(
                  $diagnostic,
                  "\r\n|\n|\r"
                )) {
                  Write-Host "[contained-construction] $line"
                }
              }
            }
            catch {
              throw "Contained construction failed without a valid bounded status record."
            }
            throw "Contained construction failed at $validatedStage with exit code $validatedExitCode."
          }

          $publish = Join-Path $output "publish"
          $publishedLauncher = Join-Path $publish "parser-pack-appcontainer-launcher.exe"
          [System.IO.File]::Copy($launcher, $publishedLauncher, $false)
          $launcherDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath $launcher).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path $publish "parser-pack-appcontainer-launcher.sha256"),
            "$launcherDigest`n",
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Revalidate exact candidate after construction
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $revision = (git rev-parse HEAD).Trim()
          $status = @(git status --porcelain=v1 --untracked-files=all)
          $lockSha = (Get-FileHash -Algorithm SHA256 -LiteralPath "Cargo.lock").Hash.ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or
              $revision -ne "${{ steps.identity.outputs.revision }}" -or
              $status.Count -ne 0 -or
              $lockSha -ne "${{ steps.identity.outputs.cargo_lock_sha256 }}") {
            throw "Candidate source changed during contained construction."
          }

      - name: Upload immutable construction output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: parser-pack-${{ matrix.target }}-construction
          path: ${{ runner.temp }}/parser-pack-output/publish/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  verify:
    name: verify ${{ matrix.target }}
    needs: construct
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            isolation: linux-network-namespace
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            isolation: windows-app-container
    steps:
      - name: Download platform construction output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: parser-pack-${{ matrix.target }}-construction
          path: ${{ runner.temp }}/parser-pack-download

      - name: Validate fresh-runner package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $download = Join-Path $env:RUNNER_TEMP "parser-pack-download"
          $suffix = ""
          if ($env:RUNNER_OS -eq "Windows") { $suffix = ".exe" }
          $expected = @(
            "accepted-capabilities.json",
            "check-parser-pack-network-boundary.ps1",
            "optional_parser_pack_release$suffix",
            "optional_parser_pack_release.sha256",
            "projectatlas-broad-parser-${{ matrix.target }}.tar.zst"
          )
          if ($env:RUNNER_OS -eq "Windows") {
            $expected += @(
              "parser-pack-appcontainer-launcher.exe",
              "parser-pack-appcontainer-launcher.sha256"
            )
          }
          $items = @(Get-ChildItem -LiteralPath $download -Force)
          if (@($items | Where-Object { $_.PSIsContainer }).Count -ne 0) {
            throw "Fresh-runner package contains an unexpected directory."
          }
          $actual = @($items | ForEach-Object { $_.Name } | Sort-Object)
          $expected = @($expected | Sort-Object)
          if (Compare-Object -ReferenceObject $expected -DifferenceObject $actual) {
            throw "Fresh-runner package does not match the closed file inventory."
          }
          foreach ($item in $items) {
            if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0 -or $item.Length -le 0) {
              throw "Fresh-runner package contains a non-regular or empty file."
            }
          }

          $verifier = Join-Path $download "optional_parser_pack_release$suffix"
          $expectedVerifierHash = [System.IO.File]::ReadAllText(
            (Join-Path $download "optional_parser_pack_release.sha256")
          ).Trim()
          if ($expectedVerifierHash -notmatch '\A[0-9a-f]{64}\z' -or
              (Get-FileHash -Algorithm SHA256 -LiteralPath $verifier).Hash.ToLowerInvariant() -ne $expectedVerifierHash) {
            throw "Fresh-runner verifier digest is invalid."
          }
          if ($env:RUNNER_OS -ne "Windows") {
            & /bin/chmod 0755 $verifier
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          foreach ($directoryName in @("parser-pack-verify-output", "parser-pack-verify-temp", "parser-pack-verify-home")) {
            [System.IO.Directory]::CreateDirectory((Join-Path $env:RUNNER_TEMP $directoryName)) | Out-Null
          }

      - name: Prove fresh-runner baseline network reachability
        id: network
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $checker = Join-Path $env:RUNNER_TEMP "parser-pack-download/check-parser-pack-network-boundary.ps1"
          $discovery = pwsh -NoProfile -File $checker -Mode discover-resolver | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File $checker -Mode require-reachable -ResolverAddress $discovery.resolver_address
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "resolver_address=$($discovery.resolver_address)" >> $env:GITHUB_OUTPUT

      - name: Recheck standalone AppContainer launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $download = Join-Path $env:RUNNER_TEMP "parser-pack-download"
          $launcher = Join-Path $download "parser-pack-appcontainer-launcher.exe"
          $expected = [System.IO.File]::ReadAllText(
            (Join-Path $download "parser-pack-appcontainer-launcher.sha256")
          ).Trim()
          if ($expected -notmatch '\A[0-9a-f]{64}\z' -or
              (Get-FileHash -Algorithm SHA256 -LiteralPath $launcher).Hash.ToLowerInvariant() -ne $expected) {
            throw "Downloaded AppContainer launcher digest is invalid."
          }
          & $launcher self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prove Linux fresh-runner network denial
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          setpriv_path="$(command -v setpriv)"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          sudo --non-interactive unshare --net -- \
            "$setpriv_path" --no-new-privs --reuid="$runner_uid" --regid="$runner_gid" --clear-groups \
            /usr/bin/env -i \
              HOME="$RUNNER_TEMP/parser-pack-verify-home" \
              TMPDIR="$RUNNER_TEMP/parser-pack-verify-temp" \
            "$(command -v pwsh)" -NoLogo -NoProfile -NonInteractive \
              -File "$RUNNER_TEMP/parser-pack-download/check-parser-pack-network-boundary.ps1" \
              -Mode require-denied \
              -ResolverAddress '${{ steps.network.outputs.resolver_address }}'

      - name: Prove Windows fresh-runner network denial
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $download = Join-Path $env:RUNNER_TEMP "parser-pack-download"
          $output = Join-Path $env:RUNNER_TEMP "parser-pack-verify-output"
          $temp = Join-Path $env:RUNNER_TEMP "parser-pack-verify-temp"
          $launcher = Join-Path $download "parser-pack-appcontainer-launcher.exe"
          $pwsh = [System.Diagnostics.Process]::GetCurrentProcess().MainModule.FileName
          & $launcher launch `
            --executable $pwsh `
            --working-directory $output `
            --temp-directory $temp `
            --timeout-seconds 60 `
            --read-root $download `
            --read-root (Split-Path -Parent $pwsh) `
            --write-root $output `
            --write-root $temp `
            -- `
            -NoLogo -NoProfile -NonInteractive `
            -File (Join-Path $download "check-parser-pack-network-boundary.ps1") `
            -Mode require-denied `
            -ResolverAddress '${{ steps.network.outputs.resolver_address }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write fresh-runner context
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $download = Join-Path $env:RUNNER_TEMP "parser-pack-download"
          $context = [ordered]@{
            fresh_host = "verified"
            repository_inputs_absent = "verified"
            build_tools_not_invoked = "verified"
            working_directory_outside_pack = "verified"
            ambient_library_paths_cleared = "verified"
            network_denial = [ordered]@{
              mechanism = "${{ matrix.isolation }}"
              dns_denied = $true
              direct_tcp_denied = $true
              https_denied = $true
            }
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $download "runner-context.json"),
            (($context | ConvertTo-Json -Depth 4) + "`n"),
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Verify archive inside Linux network namespace
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          download="$RUNNER_TEMP/parser-pack-download"
          output="$RUNNER_TEMP/parser-pack-verify-output"
          temp="$RUNNER_TEMP/parser-pack-verify-temp"
          cd "$output"
          setpriv_path="$(command -v setpriv)"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          sudo --non-interactive unshare --net -- \
            "$setpriv_path" --no-new-privs --reuid="$runner_uid" --regid="$runner_gid" --clear-groups \
            /usr/bin/env -i \
              HOME="$RUNNER_TEMP/parser-pack-verify-home" \
              TMPDIR="$temp" \
            "$download/optional_parser_pack_release" verify \
              "$download/projectatlas-broad-parser-${{ matrix.target }}.tar.zst" \
              "$download/runner-context.json" \
              "$output/platform-proof-${{ matrix.target }}.json"

      - name: Verify archive through production Windows containment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $download = Join-Path $env:RUNNER_TEMP "parser-pack-download"
          $output = Join-Path $env:RUNNER_TEMP "parser-pack-verify-output"
          $temp = Join-Path $env:RUNNER_TEMP "parser-pack-verify-temp"
          $verifier = Join-Path $download "optional_parser_pack_release.exe"
          $start = [System.Diagnostics.ProcessStartInfo]::new()
          $start.FileName = $verifier
          $start.WorkingDirectory = $output
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $start.Environment.Clear()
          $start.Environment["SystemRoot"] = $env:SystemRoot
          $start.Environment["WINDIR"] = $env:WINDIR
          $start.Environment["TEMP"] = $temp
          $start.Environment["TMP"] = $temp
          foreach ($argument in @(
            "verify",
            (Join-Path $download "projectatlas-broad-parser-${{ matrix.target }}.tar.zst"),
            (Join-Path $download "runner-context.json"),
            (Join-Path $output "platform-proof-${{ matrix.target }}.json")
          )) {
            $start.ArgumentList.Add($argument)
          }
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $start
          try {
            if (-not $process.Start()) {
              throw "Fresh-runner verifier did not start."
            }
            $stdout = $process.StandardOutput.ReadToEndAsync()
            $stderr = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(1800000)) {
              $process.Kill($true)
              if (-not $process.WaitForExit(5000)) {
                throw "Fresh-runner verifier could not be reaped within 5 seconds after termination."
              }
              throw "Fresh-runner verifier exceeded its 1800-second deadline."
            }
            $stdoutText = $stdout.GetAwaiter().GetResult()
            $stderrText = $stderr.GetAwaiter().GetResult()
            if (-not [string]::IsNullOrWhiteSpace($stdoutText)) { Write-Host $stdoutText.TrimEnd() }
            if (-not [string]::IsNullOrWhiteSpace($stderrText)) { Write-Host $stderrText.TrimEnd() }
            if ($process.ExitCode -ne 0) {
              throw "Fresh-runner verifier failed with exit code $($process.ExitCode)."
            }
          }
          finally {
            $process.Dispose()
          }

      - name: Upload fresh platform proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: parser-pack-${{ matrix.target }}-proof
          path: ${{ runner.temp }}/parser-pack-verify-output/platform-proof-${{ matrix.target }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  runtime-e2e:
    name: normal runtime lifecycle ${{ matrix.target }}
    needs: [construct, verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default $env:RUSTUP_TOOLCHAIN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bind exact clean candidate identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $revision = (git rev-parse HEAD).Trim()
          $status = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $revision -ne $env:GITHUB_SHA -or $status.Count -ne 0) {
            throw "Normal-runtime parser-pack verification requires the exact clean candidate."
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download platform construction output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: parser-pack-${{ matrix.target }}-construction
          path: ${{ runner.temp }}/parser-pack-runtime-e2e

      - name: Exercise packaged archive through the normal runtime lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path `
            $env:RUNNER_TEMP `
            "parser-pack-runtime-e2e/projectatlas-broad-parser-${{ matrix.target }}.tar.zst"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Normal-runtime parser-pack archive is missing."
          }

          function Get-OptionalParserProcessIds {
            if ($env:RUNNER_OS -eq "Windows") {
              return @(
                Get-CimInstance Win32_Process |
                  Where-Object {
                    $_.Name -in @(
                      "projectatlas-parser-worker.exe",
                      "projectatlas-parser-containment.exe"
                    )
                  } |
                  ForEach-Object { [int]$_.ProcessId }
              )
            }
            return @(
              & /bin/ps -eo pid=,args= |
                ForEach-Object {
                  if ($_ -match '^\s*(\d+)\s+.*(?:/|\\)projectatlas-parser-worker(?:\s|$)') {
                    [int]$Matches[1]
                  }
                }
            )
          }

          $before = @(Get-OptionalParserProcessIds)
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "parser-pack-runtime-e2e-target"
          $env:PROJECTATLAS_OPTIONAL_PARSER_ARCHIVE = $archive
          cargo test `
            -p projectatlas-cli `
            --test e2e `
            --locked `
            optional_parser_pack_real_archive_normal_runtime_lifecycle `
            -- `
            --ignored `
            --exact `
            --nocapture
          $testExitCode = $LASTEXITCODE

          $after = @(Get-OptionalParserProcessIds)
          $residue = @($after | Where-Object { $_ -notin $before })
          if ($residue.Count -ne 0) {
            throw "Normal-runtime parser-pack test retained process IDs: $($residue -join ', ')."
          }
          if ($testExitCode -ne 0) { exit $testExitCode }

          $revision = (git rev-parse HEAD).Trim()
          $status = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $revision -ne $env:GITHUB_SHA -or $status.Count -ne 0) {
            throw "Candidate source changed during normal-runtime parser-pack verification."
          }

      - name: Prove contained worker crash preserves publication
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path `
            $env:RUNNER_TEMP `
            "parser-pack-runtime-e2e/projectatlas-broad-parser-${{ matrix.target }}.tar.zst"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Normal-runtime parser-pack archive is missing."
          }

          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "parser-pack-runtime-e2e-target"
          $env:PROJECTATLAS_OPTIONAL_PARSER_ARCHIVE = $archive
          cargo test `
            -p projectatlas-cli `
            --test optional_parser_worker_failure `
            --locked `
            contained_worker_crash_preserves_active_generation `
            -- `
            --ignored `
            --exact `
            --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $revision = (git rev-parse HEAD).Trim()
          $status = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $revision -ne $env:GITHUB_SHA -or $status.Count -ne 0) {
            throw "Candidate source changed during contained-worker failure verification."
          }

      - name: Prove stalled worker cancellation preserves MCP reads and publication
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path `
            $env:RUNNER_TEMP `
            "parser-pack-runtime-e2e/projectatlas-broad-parser-${{ matrix.target }}.tar.zst"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Normal-runtime parser-pack archive is missing."
          }

          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "parser-pack-runtime-e2e-target"
          $env:PROJECTATLAS_OPTIONAL_PARSER_ARCHIVE = $archive
          cargo test `
            -p projectatlas-cli `
            --test optional_parser_worker_failure `
            --locked `
            stalled_worker_cancellation_preserves_mcp_reads_and_active_generation `
            -- `
            --ignored `
            --exact `
            --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $revision = (git rev-parse HEAD).Trim()
          $status = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $revision -ne $env:GITHUB_SHA -or $status.Count -ne 0) {
            throw "Candidate source changed during stalled-worker cancellation verification."
          }

      - name: Measure the absent-pack default and control runtime boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path `
            $env:RUNNER_TEMP `
            "parser-pack-runtime-e2e/projectatlas-broad-parser-${{ matrix.target }}.tar.zst"
          $measurementDirectory = Join-Path $env:RUNNER_TEMP "parser-pack-runtime-measurement"
          [System.IO.Directory]::CreateDirectory($measurementDirectory) | Out-Null
          pwsh -NoProfile -NonInteractive `
            -File .github/scripts/measure-default-runtime-optional-pack-boundary.ps1 `
            -SourceRoot $env:GITHUB_WORKSPACE `
            -ArchivePath $archive `
            -CargoTargetRoot (Join-Path $env:RUNNER_TEMP "parser-pack-runtime-comparison-targets") `
            -OutputPath (Join-Path $measurementDirectory "absent-pack-runtime-comparison-${{ matrix.target }}.json") `
            -Target "${{ matrix.target }}" `
            -CandidateSha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload absent-pack runtime comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: parser-pack-${{ matrix.target }}-absent-pack-runtime-comparison
          path: ${{ runner.temp }}/parser-pack-runtime-measurement/absent-pack-runtime-comparison-${{ matrix.target }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  aggregate:
    name: aggregate exact supported-platform proof
    needs: [verify, runtime-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download Linux construction tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: parser-pack-x86_64-unknown-linux-gnu-construction
          path: ${{ runner.temp }}/parser-pack-aggregate-tools

      - name: Download all platform proofs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: parser-pack-*-proof
          path: ${{ runner.temp }}/parser-pack-aggregate-proofs
          merge-multiple: true

      - name: Aggregate exact proofs
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/parser-pack-aggregate-tools"
          proofs="$RUNNER_TEMP/parser-pack-aggregate-proofs"
          output="$RUNNER_TEMP/parser-pack-aggregate-output"
          mkdir -p "$output"
          expected_hash="$(tr -d '\r\n' < "$tools/optional_parser_pack_release.sha256")"
          observed_hash="$(sha256sum "$tools/optional_parser_pack_release" | awk '{print $1}')"
          test "$expected_hash" = "$observed_hash"
          chmod 0755 "$tools/optional_parser_pack_release"
          test "$(find "$proofs" -maxdepth 1 -type f -name 'platform-proof-*.json' | wc -l)" -eq 2
          /usr/bin/env -i \
            HOME="$RUNNER_TEMP" \
            TMPDIR="$RUNNER_TEMP" \
            "$tools/optional_parser_pack_release" aggregate \
              "$tools/accepted-capabilities.json" \
              "$proofs/platform-proof-x86_64-unknown-linux-gnu.json" \
              "$proofs/platform-proof-x86_64-pc-windows-msvc.json" \
              "$output/optional-parser-pack-proof-aggregate.json"

      - name: Upload aggregate proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: optional-parser-pack-proof-aggregate
          path: ${{ runner.temp }}/parser-pack-aggregate-output/optional-parser-pack-proof-aggregate.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
