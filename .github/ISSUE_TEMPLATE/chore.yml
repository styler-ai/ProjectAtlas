name: Chore
description: Track ProjectAtlas maintenance, CI, release, installer, or repository policy work.
title: "chore: "
labels:
  - type:chore
  - priority:medium
  - status:ready
  - complexity:medium
body:
  - type: markdown
    attributes:
      value: |
        Use this template for planned maintenance work that is not a bug report or product feature request.
  - type: textarea
    id: summary
    attributes:
      label: Why
      description: Why is this maintenance or policy work needed?
      placeholder: "Add a PR gate for unresolved GitHub Codex review threads..."
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: What Changes
      description: What maintenance or policy behavior will change?
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: Capabilities
      description: Which product, agent, repository, or workflow capabilities are added or modified?
    validations:
      required: true
  - type: textarea
    id: architecture_diagrams
    attributes:
      label: Architecture Diagrams
      description: Link the versioned Markdown architecture views for this work under `https://github.com/styler-ai/ProjectAtlas/blob/main/docs/`. Reuse an existing document when architecture is unchanged; do not attach a duplicate PDF.
      placeholder: "- [Architecture views](https://github.com/styler-ai/ProjectAtlas/blob/main/docs/projectatlas-3-architecture.md#user-content-architecture-views)"
    validations:
      required: true
  - type: textarea
    id: release_scope
    attributes:
      label: Release Scope
      description: Which milestone owns this work and what implementation surface is expected?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - CI / GitHub Actions
        - Release process
        - Plugin installer
        - Repository policy
        - Documentation
        - Tests
        - Other
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true before this can close?
      placeholder: |
        - CI check fails when ...
        - Tests cover ...
        - Documentation updated ...
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-Goals
      description: What must this work deliberately avoid?
    validations:
      required: true
  - type: textarea
    id: premortem
    attributes:
      label: Pre-Mortem
      description: List likely failures and mitigation checkboxes mapped to the OpenSpec tasks that own them.
      placeholder: |
        Likely failure modes:
        - The workflow accepts stale task state.

        Mitigations:
        - [ ] Compare local and issue task state exactly. (Implementation tasks: 1.2)
    validations:
      required: true
  - type: textarea
    id: openspec
    attributes:
      label: OpenSpec plan and task checklist
      description: Maintainers or agents should fill this before planned implementation. Mirror the linked `openspec/changes/<id>/tasks.md` checklist exactly under an `Implementation Tasks` heading; check each implementation row immediately after its behavior and required task-level proof pass, and reopen it with acceptance rows reset when review finds partial work before closing or releasing.
      value: |
        OpenSpec change: _to be assigned_

        ## Implementation Tasks

        <!-- Mirror tasks from `openspec/changes/<id>/tasks.md` here before implementation. -->
  - type: checkboxes
    id: acceptance_review_tasks
    attributes:
      label: Acceptance and Review Tasks
      description: Keep these five canonical review gates in order; they remain unchecked until implementation is complete and then advance as a checked prefix. Reset every row if implementation reopens after partial review.
      options:
        - label: "Intent and outcome review: Confirm the delivered behavior solves the complete issue `Why` and `What Changes`, provides the declared capabilities and release scope, and respects the non-goals at the real user or agent boundary."
          required: false
        - label: "Implementation review: Review the complete implementation for correctness, architecture and ownership, applicable Rust and database pattern fit, security, resource bounds, compatibility, and unnecessary complexity; resolve every material finding."
          required: false
        - label: "Specification and architecture review: Reconcile the issue, OpenSpec requirements and tasks, source, documentation, and every required architecture diagram; add missing specifications or diagrams or record a reasoned N/A when no view is needed."
          required: false
        - label: "Test and proof review: Confirm the owning unit, integration, E2E, fault, concurrency, performance, and platform tests required by the issue are sound, causally exercise real behavior, and cover positive, negative, failure, and compatibility outcomes."
          required: false
        - label: "Final readiness review: Confirm every implementation task is complete, all human and automated review feedback is resolved or dispositioned, required local and hosted gates pass, and no behavior or proof boundary remains partial."
          required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, tokens, private repository names, and private filesystem paths from this issue.
          required: true
