name: Chore
description: Track ProjectAtlas maintenance, CI, release, installer, or repository policy work.
title: "chore: "
labels:
  - type:chore
  - priority:medium
  - status:ready
  - complexity:medium
body:
  - type: markdown
    attributes:
      value: |
        Use this template for planned maintenance work that is not a bug report or product feature request.
  - type: textarea
    id: summary
    attributes:
      label: Why
      description: Why is this maintenance or policy work needed?
      placeholder: "Add a PR gate for unresolved GitHub Codex review threads..."
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: What Changes
      description: What maintenance or policy behavior will change?
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: Capabilities
      description: Which product, agent, repository, or workflow capabilities are added or modified?
    validations:
      required: true
  - type: textarea
    id: architecture_diagrams
    attributes:
      label: Architecture Diagrams
      description: Link the versioned Markdown architecture views for this work under `https://github.com/styler-ai/ProjectAtlas/blob/main/docs/`. Reuse an existing document when architecture is unchanged; do not attach a duplicate PDF.
      placeholder: "- [Architecture views](https://github.com/styler-ai/ProjectAtlas/blob/main/docs/projectatlas-3-architecture.md#user-content-architecture-views)"
    validations:
      required: true
  - type: textarea
    id: release_scope
    attributes:
      label: Release Scope
      description: Which milestone owns this work and what implementation surface is expected?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - CI / GitHub Actions
        - Release process
        - Plugin installer
        - Repository policy
        - Documentation
        - Tests
        - Other
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true before this can close?
      placeholder: |
        - CI check fails when ...
        - Tests cover ...
        - Documentation updated ...
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-Goals
      description: What must this work deliberately avoid?
    validations:
      required: true
  - type: textarea
    id: premortem
    attributes:
      label: Pre-Mortem
      description: List likely failures and mitigation checkboxes mapped to the OpenSpec tasks that own them.
      placeholder: |
        Likely failure modes:
        - The workflow accepts stale task state.

        Mitigations:
        - [ ] Compare local and issue task state exactly. (Implementation tasks: 1.2)
    validations:
      required: true
  - type: textarea
    id: openspec
    attributes:
      label: OpenSpec plan and task checklist
      description: Maintainers add the mapped OpenSpec change and implementation checklist after this issue receives a real mapping; unmapped backlog issues do not carry authoritative task fields.
      placeholder: Maintainers add the mapped change and implementation checklist after assignment.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, tokens, private repository names, and private filesystem paths from this issue.
          required: true
