name: Improvement request
description: Suggest a ProjectAtlas feature, workflow improvement, or usability change.
title: "feat: "
labels:
  - type:feature
  - priority:medium
  - status:backlog
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. ProjectAtlas is agent-first, so the best requests explain what the agent should do better.
  - type: textarea
    id: problem
    attributes:
      label: Why
      description: What is hard, slow, confusing, or missing today?
      placeholder: "I want ProjectAtlas to show token savings trends across sessions..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What Changes
      description: What should ProjectAtlas do?
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: Capabilities
      description: Which ProjectAtlas capabilities are added or modified?
    validations:
      required: true
  - type: textarea
    id: architecture_diagrams
    attributes:
      label: Architecture Diagrams
      description: Link the versioned Markdown architecture views for this work under `https://github.com/styler-ai/ProjectAtlas/blob/dev/docs/`. Reuse an existing document when architecture is unchanged; do not attach a duplicate PDF.
      placeholder: "- [Architecture views](https://github.com/styler-ai/ProjectAtlas/blob/dev/docs/projectatlas-3-architecture.md#architecture-views)"
    validations:
      required: true
  - type: textarea
    id: release_scope
    attributes:
      label: Release Scope
      description: Which milestone owns this work and what implementation surface is expected?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Agent workflow
        - CLI
        - MCP tools
        - Plugin installer
        - Documentation
        - Performance
        - Token telemetry
        - Other
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Agent workflow
      description: If this affects agent behavior, describe the ideal ProjectAtlas funnel.
      placeholder: "overview -> folders -> files -> summary -> slice"
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What would make this clearly done?
      placeholder: |
        - CLI output includes ...
        - MCP output includes ...
        - Tests cover ...
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Non-Goals
      description: Anything ProjectAtlas should avoid?
      placeholder: "Do not require network calls or provider credentials by default."
    validations:
      required: true
  - type: textarea
    id: premortem
    attributes:
      label: Pre-Mortem
      description: List likely failures and mitigation checkboxes mapped to the OpenSpec tasks that own them.
      placeholder: |
        Likely failure modes:
        - The new workflow increases agent calls.

        Mitigations:
        - [ ] Compare representative agent workflows. (OpenSpec tasks: 5.3, 7.2)
    validations:
      required: true
  - type: textarea
    id: openspec
    attributes:
      label: OpenSpec plan and task checklist
      description: Maintainers or agents should fill this before planned implementation. Mirror the linked `openspec/changes/<id>/tasks.md` checklist under an `OpenSpec Tasks` heading before closing or releasing.
      value: |
        OpenSpec change: _to be assigned_

        ## OpenSpec Tasks

        <!-- Mirror tasks from `openspec/changes/<id>/tasks.md` here before implementation. -->
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, tokens, private repository names, and private filesystem paths from this request.
          required: true
