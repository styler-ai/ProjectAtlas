name: Bug report
description: Report something in ProjectAtlas that is broken or behaving incorrectly.
title: "bug: "
labels:
  - type:bug
  - priority:medium
  - status:ready
  - complexity:medium
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a ProjectAtlas bug. Please include enough detail for someone else to reproduce it without access to your private repository.
  - type: textarea
    id: summary
    attributes:
      label: Why
      description: What is broken, and why does it matter?
      placeholder: "ProjectAtlas reports stale file purposes after..."
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: What Changes
      description: What behavior should change to resolve the bug?
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: Capabilities
      description: Which ProjectAtlas capabilities are affected or need correction?
    validations:
      required: true
  - type: textarea
    id: architecture_diagrams
    attributes:
      label: Architecture Diagrams
      description: Link the versioned Markdown architecture views for this work under `https://github.com/styler-ai/ProjectAtlas/blob/main/docs/`. Reuse an existing document when architecture is unchanged; do not attach a duplicate PDF.
      placeholder: "- [Architecture views](https://github.com/styler-ai/ProjectAtlas/blob/main/docs/projectatlas-3-architecture.md#user-content-architecture-views)"
    validations:
      required: true
  - type: textarea
    id: release_scope
    attributes:
      label: Release Scope
      description: Which milestone and implementation surfaces should contain the fix?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the smallest steps that reproduce the behavior.
      placeholder: |
        1. Run `projectatlas scan`
        2. Run `projectatlas summary ...`
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should ProjectAtlas have done?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include relevant output if possible.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable behavior and tests must pass before this bug is fixed?
      placeholder: |
        - The reproduction no longer fails.
        - Regression tests cover the corrected behavior.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, shell, ProjectAtlas version, host agent, and install method.
      placeholder: |
        - OS: Windows / Linux / macOS
        - Shell: PowerShell / bash / zsh
        - ProjectAtlas version: `projectatlas --version`
        - Agent host: Codex / Claude Code / OpenCode / other
        - Install method: plugin / release asset / cargo install
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste relevant terminal output. Redact secrets and private paths.
      render: shell
  - type: textarea
    id: non_goals
    attributes:
      label: Non-Goals
      description: What must the fix deliberately avoid changing?
    validations:
      required: true
  - type: textarea
    id: premortem
    attributes:
      label: Pre-Mortem
      description: List likely fix failures and mitigation checkboxes mapped to the OpenSpec tasks that own them.
      placeholder: |
        Likely failure modes:
        - The fix handles the reported case but breaks a compatibility path.

        Mitigations:
        - [ ] Cover the reproduction and compatibility behavior together. (Implementation tasks: 1.2)
    validations:
      required: true
  - type: textarea
    id: openspec
    attributes:
      label: OpenSpec plan and task checklist
      description: Maintainers or agents should fill this before planned implementation. Mirror the linked `openspec/changes/<id>/tasks.md` checklist exactly under an `Implementation Tasks` heading before closing or releasing.
      value: |
        OpenSpec change: _to be assigned_

        ## Implementation Tasks

        <!-- Mirror tasks from `openspec/changes/<id>/tasks.md` here before implementation. -->
  - type: checkboxes
    id: acceptance_review_tasks
    attributes:
      label: Acceptance and Review Tasks
      description: Keep these five canonical review gates in order; they remain unchecked until implementation is complete and then advance as a checked prefix.
      options:
        - label: "Intent and outcome review: Confirm the delivered behavior solves the complete issue `Why` and `What Changes`, provides the declared capabilities and release scope, and respects the non-goals at the real user or agent boundary."
          required: false
        - label: "Implementation review: Review the complete implementation for correctness, architecture and ownership, applicable Rust and database pattern fit, security, resource bounds, compatibility, and unnecessary complexity; resolve every material finding."
          required: false
        - label: "Specification and architecture review: Reconcile the issue, OpenSpec requirements and tasks, source, documentation, and every required architecture diagram; add missing specifications or diagrams or record a reasoned N/A when no view is needed."
          required: false
        - label: "Test and proof review: Confirm the owning unit, integration, E2E, fault, concurrency, performance, and platform tests required by the issue are sound, causally exercise real behavior, and cover positive, negative, failure, and compatibility outcomes."
          required: false
        - label: "Final readiness review: Confirm every implementation task is complete, all human and automated review feedback is resolved or dispositioned, required local and hosted gates pass, and no behavior or proof boundary remains partial."
          required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, tokens, private repository names, and private filesystem paths from this report.
          required: true
