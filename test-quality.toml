# Purpose: Define ProjectAtlas Rust quality targets, floors, evidence, and IssueOps policy.

schema_version = 1
policy_id = "projectatlas-rust-quality-v1"
repository = "styler-ai/ProjectAtlas"
release_milestone = "v0.4.0-00"
required_changes = [
    "advance-rust-repository-intelligence",
    "enforce-rust-test-quality-gates",
]

[tools]
cargo_nextest = "0.9.140"
cargo_llvm_cov = "0.8.7"
cargo_mutants = "27.1.0"

[reference_toolchain]
rust = "1.93.1"
llvm = "21.1.8"
host = "x86_64-pc-windows-msvc"

[scope]
include_globs = ["crates/*/src/**/*.rs"]
exclude_globs = []
exclude_categories = ["test-only", "generated", "proven-unreachable"]
blanket_exclusions_allowed = false
raw_rows_retained = true

[timeouts]
nextest_test_seconds = 120
nextest_command_seconds = 1200
nextest_job_seconds = 1500
doctest_command_seconds = 900
doctest_job_seconds = 1200
coverage_command_seconds = 2400
coverage_job_seconds = 2700
changed_mutant_test_seconds = 180
changed_mutant_build_seconds = 900
changed_mutation_command_seconds = 2700
changed_mutation_job_seconds = 3000
inventory_command_seconds = 900
inventory_job_seconds = 1200
mutation_shard_test_seconds = 180
mutation_shard_build_seconds = 900
mutation_shard_command_seconds = 6300
mutation_shard_job_seconds = 7200
mutation_aggregate_command_seconds = 600
mutation_aggregate_job_seconds = 900
release_consumption_command_seconds = 600
release_consumption_job_seconds = 900

[retention]
artifact_days = 90
release_decision_window_days = 30

[targets.coverage.lines]
raw_basis_points = 9800
adjusted_basis_points = 10000
tracking_issue = 309

[targets.coverage.regions]
raw_basis_points = 9500
adjusted_basis_points = 9800
tracking_issue = 309

[targets.coverage.functions]
raw_basis_points = 9800
adjusted_basis_points = 10000
tracking_issue = 309

[targets.mutation]
raw_viable_kill_basis_points = 9000
adjusted_viable_kill_basis_points = 9500
tracking_issue = 309

[target_policy]
target_gap_waivers_allowed = false
public_complete_claim_requires_complete_counts = true

[evidence]
manifest_schema_version = 1
verification_plan = "openspec/task-verification.json"
task_ledger = "openspec/task-evidence.json"
output_root = "target/projectatlas-quality"
metadata_only_closure = true
closure_task_mutations = ["checkbox-state-only"]
closure_ledger_mutations = ["current-evidence-pointer-only"]
closure_issue_map_mutations = []
require_pr_head_aggregate = true
trusted_result_kinds = ["github-actions", "repository-retained-local"]

[issueops]
body_character_limit = 65536
managed_marker_prefix = "projectatlas-task-evidence:v1"
evidence_comment_scope = "top-level-section"
pull_request_issue_field = "OpenSpec-Issue"
pull_request_scope_field = "OpenSpec-Task"
allow_pull_request_target = false
execute_artifact_commands = false
trust_caller_urls_or_status = false
fork_writeback_allowed = false

[exception_schema]
common_required_fields = [
    "id",
    "category",
    "rationale",
    "owner",
    "tracking_issue",
    "approved_by",
    "approved_on",
    "source_sha256",
]
coverage_selector_fields = ["path", "start_line", "end_line"]
mutation_selector_fields = ["mutant_id", "path"]
expiry_fields = ["expires_on", "expires_release"]
exact_selector_required = true
future_expiry_required = true
exactly_one_expiry_required = true
overlap_allowed = false
unused_allowed = false

[exceptions]
records = []

