[graph]
targets = [
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "x86_64-apple-darwin" },
  { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# tree-sitter-language-pack pulls webpki-roots through its build-only
# ureq path; keep this exception exact until the upstream build graph removes it.
exceptions = [
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots@1.0.10" },
]

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "deny"
highlight = "all"
skip = [
  { crate = "bitflags@1.3.2", reason = "Windows-only windows-permissions 0.2.4 provides safe OsStr-compatible handle-based ACL snapshot/application without project unsafe bindings; it retains bitflags 1 while the remaining graph uses 2. Remove when that wrapper updates its flag dependency or an equivalent safe native handle API replaces it." },
  { crate = "compact_str@0.10.0", reason = "Canonical ECMAScript identifier predicates in pinned oxc_syntax 0.156 require compact_str 0.10 through oxc_span/oxc_str; ratatui 0.30 requires 0.9. Remove when those upstream dependency ranges converge." },
  { crate = "phf@0.14.0", reason = "Pinned oxc_syntax 0.156 and oxc_ast_macros require phf 0.14; cssparser/selectors/web_atoms require 0.13. Remove when the upstream ranges converge." },
  { crate = "phf_generator@0.14.0", reason = "Required by the phf 0.14 macro line of pinned oxc_syntax 0.156; the HTML parser build graph retains phf_generator 0.13. Remove when upstream phf dependency ranges converge." },
  { crate = "phf_macros@0.14.0", reason = "Required by phf 0.14 in pinned oxc_syntax 0.156; the HTML parser graph retains phf_macros 0.13. Remove when upstream phf dependency ranges converge." },
  { crate = "phf_shared@0.14.0", reason = "Required by phf 0.14 in pinned oxc_syntax 0.156; the HTML parser graph retains phf_shared 0.13. Remove when upstream phf dependency ranges converge." },
  { crate = "hashbrown@0.16.1", reason = "yaml-rust2 0.11 and ratatui 0.30 resolve hashbrown 0.16; remove when both upstream paths converge on the retained hashbrown line." },
  { crate = "getrandom@0.2.17", reason = "tree-sitter-language-pack 1.13.2 resolves ahash through getrandom 0.2 only in the optional parser worker graph; remove when upstream adopts the retained getrandom line." },
  { crate = "darling@0.24.1", reason = "rmcp-macros 3.1.x requires darling 0.24 while ratatui 0.30 retains darling 0.23; remove when the upstream macro dependency lines converge." },
  { crate = "darling_core@0.24.1", reason = "rmcp-macros 3.1.x requires darling_core 0.24 while ratatui 0.30 retains darling_core 0.23; remove when the upstream macro dependency lines converge." },
  { crate = "darling_macro@0.24.1", reason = "rmcp-macros 3.1.x requires darling_macro 0.24 while ratatui 0.30 retains darling_macro 0.23; remove when the upstream macro dependency lines converge." },
  { crate = "syn@3.0.3", reason = "clap 4.6.6 and serde 1.0.229 resolve syn 3 while existing macro dependencies retain syn 2; remove when the upstream graph converges." },
  { crate = "windows-sys@0.60.2", reason = "notify 8.2 resolves windows-sys 0.60; remove when notify adopts the retained windows-sys line." },
]

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
