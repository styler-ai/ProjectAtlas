[graph]
targets = [
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "x86_64-apple-darwin" },
  { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# tree-sitter-language-pack 1.13.2 pulls webpki-roots through its build-only
# ureq path; keep this exception exact until the upstream build graph removes it.
exceptions = [
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots@1.0.9" },
]

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "deny"
highlight = "all"
skip = [
  { crate = "hashbrown@0.14.5", reason = "rusqlite 0.32 resolves hashlink 0.9 and hashbrown 0.14; remove when rusqlite adopts the retained hashlink and hashbrown lines." },
  { crate = "hashbrown@0.16.1", reason = "yaml-rust2 0.11 and ratatui 0.30 resolve hashbrown 0.16; remove when both upstream paths converge on the retained hashbrown line." },
  { crate = "hashlink@0.9.1", reason = "rusqlite 0.32 resolves hashlink 0.9; remove when rusqlite adopts the retained hashlink line." },
  { crate = "getrandom@0.2.17", reason = "tree-sitter-language-pack 1.13.2 resolves ahash through getrandom 0.2 only in the optional parser worker graph; remove when upstream adopts the retained getrandom line." },
  { crate = "windows-sys@0.60.2", reason = "notify 8.2 resolves windows-sys 0.60; remove when notify adopts the retained windows-sys line." },
]

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
