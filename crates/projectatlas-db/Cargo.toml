[package]
name = "projectatlas-db"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
sqlite-progress-test-observer = []

[dependencies]
blake3.workspace = true
getrandom.workspace = true
projectatlas-core.workspace = true
projectatlas-fs.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
whichdisk.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_WindowsProgramming"] }

[target.'cfg(unix)'.dev-dependencies]
nix.workspace = true

[dev-dependencies]
rusqlite = { workspace = true, features = ["trace"] }

[lints]
workspace = true
